name: NeurixBot CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, import/neurixbot-main-cleanup]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py tickets.py ticket_panel.py ticket_closure.py guild_language.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
